<text x="900.0" y="297.0" text-anchor="middle" font-size="12" fill="#5f5e5a">BM25 + dense → MaxP</text>
<text x="900.0" y="314.0" text-anchor="middle" font-size="12" fill="#5f5e5a">→ RRF fusion</text>
<rect x="1070" y="250" width="200" height="84" rx="10" fill="#e8f0fb" stroke="#2a78d6" stroke-width="1.6"/>
