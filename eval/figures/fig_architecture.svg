<text x="900.0" y="467.0" text-anchor="middle" font-size="12" fill="#5f5e5a">hard constraints + LLM match</text>
<text x="900.0" y="484.0" text-anchor="middle" font-size="12" fill="#5f5e5a">relax filters &amp; retry</text>
<rect x="970.6" y="411" width="23.4" height="18" rx="9" fill="#1baf7a"/>
<text x="982.3" y="424" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">I3</text>
