<text x="360.0" y="450.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f1f1e">Claim self-check</text>
<text x="360.0" y="467.0" text-anchor="middle" font-size="12" fill="#5f5e5a">prices vs metadata,</text>
<text x="360.0" y="484.0" text-anchor="middle" font-size="12" fill="#5f5e5a">unsupported claims removed</text>
<rect x="430.6" y="411" width="23.4" height="18" rx="9" fill="#1baf7a"/>
<text x="442.3" y="424" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">I3</text>
