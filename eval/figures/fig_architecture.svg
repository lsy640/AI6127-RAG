<text x="630.0" y="117.0" text-anchor="middle" font-size="12" fill="#5f5e5a">HTML / noise removal, de-dup</text>
<text x="630.0" y="134.0" text-anchor="middle" font-size="12" fill="#5f5e5a">48,107 field-level chunks</text>
<rect x="800" y="70" width="200" height="84" rx="10" fill="#f6f6f4" stroke="#c9c8c2" stroke-width="1.6"/>
<text x="900.0" y="100.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f1f1e">Indexes</text>
