<text x="1170.0" y="484.0" text-anchor="middle" font-size="12" fill="#5f5e5a">entropy over candidates</text>
<rect x="1240.6" y="411" width="23.4" height="18" rx="9" fill="#eb6834"/>
<text x="1252.3" y="424" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">I1</text>
