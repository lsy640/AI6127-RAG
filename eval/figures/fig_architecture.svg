<text x="630.0" y="297.0" text-anchor="middle" font-size="12" fill="#5f5e5a">price · audience · age</text>
<text x="630.0" y="314.0" text-anchor="middle" font-size="12" fill="#5f5e5a">material · date</text>
<rect x="700.6" y="241" width="23.4" height="18" rx="9" fill="#6250d6"/>
